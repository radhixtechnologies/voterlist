services:
  - type: web
    name: voterlist-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: voterlist-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: voterlist-postgres
    plan: basic-256mb
    region: singapore
    databaseName: voterlist
    user: voterlist
